name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CI: 1

jobs:
  test:
    name: >-
      ${{ matrix.os }} ${{ matrix.ruby }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        ruby:
          - "4.0"
          - "3.4"
          - "3.3"
          - "3.2"
          - "3.1"
          - "3.0"
          - "2.7"
          - "2.6"
          - "2.5"
          - "2.4"
          - "head"
          - "jruby"
          - "jruby-head"
          - "truffleruby"
          - "truffleruby-head"
        exclude:
          - os: windows-latest
            ruby: truffleruby
          - os: windows-latest
            ruby: truffleruby-head
          - os: macos-latest
            ruby: 2.4
          - os: macos-latest
            ruby: 2.5
    steps:
      - name: repo checkout
        uses: actions/checkout@v2

      - name: load ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: install libidn2
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -qq -o Acquire::Retries=3 &&
          sudo apt-get install --fix-missing -qq -o Acquire::Retries=3 idn2

      - name: install libidn2
        if: matrix.os == 'macos-latest' && matrix.ruby != '3.2'
        run:  brew install libidn2

      - name: install dev tools
        if: matrix.os == 'windows-latest'
        run:  choco install make mingw

      - name: test
        run: |
          bundle exec rake test
        continue-on-error: ${{ matrix.os == 'windows-latest' || matrix.ruby == 'head' || matrix.ruby == 'jruby-head' || matrix.ruby == 'truffleruby-head' }}

      - name: lint
        run:  bundle exec rake rubocop
        if: matrix.ruby == '4.0'

      - name: rbs collection
        run:  bundle exec rbs collection install
        if: matrix.ruby == '4.0'

      - name: runtime type check
        run: bundle exec rbs -r ffi test --target "Idnx*" rake test
        if: matrix.ruby == '4.0'

      - name: static type check
        run: bundle exec steep check
        if: matrix.ruby == '4.0'

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{matrix.os}}-${{matrix.ruby}}
          path: coverage/
          include-hidden-files: true

  coverage:
    permissions:
      id-token: write
      pages: write
      checks: write
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0
          bundler-cache: true

      - name: Download coverage results
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage

      - name: coverage
        env:
          COVERAGE_DIR: coverage/merged
        run: |
          # rewrite mac paths
          find coverage -name "*resultset.json" -exec sed -i 's|/Users/runner/work/idnx/idnx|${{ github.workspace }}|g' {} \;
          # rewrite window paths
          find coverage -name "*resultset.json" -exec sed -i 's|D:/a/idnx/idnx|${{ github.workspace }}|g' {} \;
          bundle exec rake coverage:report
      - name: Upload simplecov results
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: coverage
        if: github.ref == 'refs/heads/master'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/master'

      - name: Check coverage
        uses: srozen/simplecov-check-action@support-simplecov-1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          coverage_path: 'coverage/merged/.last_run.json'
          coverage_json_path: 'coverage/merged/coverage.json'
          minimum_suite_coverage: 89
