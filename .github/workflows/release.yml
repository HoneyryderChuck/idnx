name: Release

on:
  push:
    branches:
      - master
    paths:
      - lib/idnx/version.rb
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check for a new version
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.version.outputs.released }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Read the version
        id: version
        run: |
          version=$(ruby -r ./lib/idnx/version -e 'print Idnx::VERSION')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.released == 'false'
    runs-on: ubuntu-latest
    name: Push v${{ needs.check.outputs.version }} to RubyGems
    environment:
      name: rubygems
      url: https://rubygems.org/gems/idnx/versions/${{ needs.check.outputs.version }}
    permissions:
      # Tag release.
      contents: write
      # Trusted publishing
      id-token: write
    env:
      VERSION: ${{ needs.check.outputs.version }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Build the gem
        run: gem build idnx.gemspec
      - name: Get RubyGems credentials
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push the gem
        run: gem push "idnx-$VERSION.gem"
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes